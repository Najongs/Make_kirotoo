    soft_limit_rad: [-0.34907, 0.31765]  # -20.0 ~ 18.2 deg = v19 소프트웨어 한계 -21.2~18.2 ∩ v20 joints.csv -20.0~20.0
    work_limit_rad: [-0.28274, 0.23038]  # -16.2 ~ 13.2 deg = v19 작업 범위 -16.2~13.2 ∩ 위 한계
  L_hip_roll:
