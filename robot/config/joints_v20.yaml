    zero_offset: 0  # [조립 후 확정] tick, tools/record_zero.py --save 가 씀
    soft_limit_rad: [0.00000, 1.71391]  # 0.0 ~ 98.2 deg = v19 소프트웨어 한계 -29.0~98.2 ∩ v20 joints.csv 0.0~100.0
    work_limit_rad: [0.00000, 1.62665]  # 0.0 ~ 93.2 deg = v19 작업 범위 0.0~93.2 ∩ 위 한계
  R_ankle_pitch:
    id: 5  # [조립 후 확정] 자리표시
