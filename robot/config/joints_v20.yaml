    zero_offset: 0  # [조립 후 확정] tick, tools/record_zero.py --save 가 씀
    soft_limit_rad: [-0.87266, 0.36303]  # -50.0 ~ 20.8 deg = v19 소프트웨어 한계 -67.5~20.8 ∩ v20 joints.csv -50.0~22.0
    work_limit_rad: [-0.87266, 0.27576]  # -50.0 ~ 15.8 deg = v19 작업 범위 -62.5~15.8 ∩ 위 한계
  R_ankle_roll:
